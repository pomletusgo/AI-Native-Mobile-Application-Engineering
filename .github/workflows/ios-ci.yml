name: iOS CI

# 触发条件：推送到 main 或对 main 发起 PR。
# 也可在 GitHub 网页的 Actions 页手动触发（workflow_dispatch）。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支的旧任务自动取消，避免排队。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # 作业 1：规格契约校验（对应 docs/验证报告.md 的 openspec validate 一行）
  # ------------------------------------------------------------------
  spec:
    name: OpenSpec Validate
    runs-on: ubuntu-latest
    env:
      # 关闭遥测，避免在受限环境下产生无关报错。
      OPENSPEC_TELEMETRY: "0"
      DO_NOT_TRACK: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate specs (--all --strict)
        run: npm run spec:validate 2>&1 | tee openspec-validate.log

      - name: Upload validate log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openspec-validate-log
          path: openspec-validate.log
          if-no-files-found: warn

  # ------------------------------------------------------------------
  # 作业 2：编译 App 并在模拟器上运行全部单元测试
  # 对应 docs/验证报告.md 中「iOS 编译（build-for-testing）」
  # 与「单元测试实际运行」两行。
  # ------------------------------------------------------------------
  ios:
    name: Build & Test (iOS Simulator)
    runs-on: macos-15
    env:
      PROJECT: CamCardClone.xcodeproj
      SCHEME: CamCardClone
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          xcrun simctl list runtimes

      # 机型名随镜像更新会变，因此不写死 iPhone 16，而是从当前可用设备里挑第一个 iPhone。
      # 完整列表会打印出来，便于排查。
      - name: Pick an available iPhone simulator
        run: |
          xcrun simctl list devices available
          SIM_UDID=$(xcrun simctl list devices available \
            | grep -m1 -E '^[[:space:]]+iPhone ' \
            | sed -E 's/^[^(]*\(([0-9A-Fa-f-]{36})\).*/\1/' || true)
          if [ -z "$SIM_UDID" ]; then
            echo "::error::No available iPhone simulator found on this runner"
            exit 1
          fi
          echo "SIM_UDID=$SIM_UDID" >> "$GITHUB_ENV"
          echo "Using simulator UDID: $SIM_UDID"

      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "id=$SIM_UDID" \
            -derivedDataPath .build-xcode \
            -resultBundlePath TestResults-build.xcresult \
            2>&1 | tee build-for-testing.log

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "id=$SIM_UDID" \
            -derivedDataPath .build-xcode \
            -only-testing:CamCardCloneTests \
            -resultBundlePath TestResults-test.xcresult \
            2>&1 | tee unit-tests.log

      # 语料检测诊断（CardBoundaryTests.testDiagnoseCorpusDetection）的报告只出现在日志里，
      # 而日志与产物的下载端点都需要仓库授权（实测 actions/jobs/<id>/logs 返回 403）。
      # 这里把报告提成 notice 注解（换行以 %0A 转义、分块发出），即可通过公开的
      # check-runs/<id>/annotations 端点读到，无需登录。
      - name: Surface corpus detection report as annotations
        if: always()
        run: |
          [ -f unit-tests.log ] || exit 0
          grep "DETECTCORPUS" unit-tests.log > detect-corpus-lines.txt || true
          echo "语料检测报告行数：$(wc -l < detect-corpus-lines.txt)"
          if [ ! -s detect-corpus-lines.txt ]; then
            echo "::warning::单测日志里没有 DETECTCORPUS 行"
            exit 0
          fi
          # 单条注解会被截断（实测约 4000 字符，30 张语料放不下），因此按 8 行一条分块，
          # 保证尾部（含合计行）也能读到。
          split -l 8 detect-corpus-lines.txt detect-corpus-part-
          for part in detect-corpus-part-*; do
            escaped=$(sed -e 's/%/%25/g' "$part" | awk '{ printf "%s%%0A", $0 }')
            echo "::notice::$(basename "$part") $escaped"
          done

      # 字段级准确率报告（FieldExtractionEvaluatorTests）同样只出现在日志里，日志端点需授权（实测 403）。
      # 报告以 `FIELDRPT` 前缀逐行输出，这里按 8 行一条分块提成 notice 注解，
      # 使前后对比的数值与错误明细都能通过公开端点读回。
      - name: Surface field accuracy report as annotations
        if: always()
        run: |
          [ -f unit-tests.log ] || exit 0
          grep "^FIELDRPT" unit-tests.log > field-report-lines.txt || true
          echo "字段级报告行数：$(wc -l < field-report-lines.txt)"
          if [ ! -s field-report-lines.txt ]; then
            echo "::warning::单测日志里没有 FIELDRPT 行"
            exit 0
          fi
          split -l 8 field-report-lines.txt field-report-part-
          for part in field-report-part-*; do
            escaped=$(sed -e 's/%/%25/g' "$part" | awk '{ printf "%s%%0A", $0 }')
            echo "::notice::$(basename "$part") $escaped"
          done

      # 日志归档需要仓库权限才能下载；这里把关键错误行提升为注解（annotation），
      # 使失败原因可以通过公开 API 读到，无需登录即可排查。
      - name: Surface errors as annotations
        if: failure()
        run: |
          for f in build-for-testing.log unit-tests.log; do
            [ -f "$f" ] || continue
            echo "===== $f ====="
            grep -E "error:|xcodebuild: error|Unable to find|Testing failed" "$f" | head -n 10 > errs.txt || true
            cat errs.txt
            while IFS= read -r line; do
              echo "::error::$line"
            done < errs.txt
          done

      - name: Upload build and test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-test-logs
          path: |
            build-for-testing.log
            unit-tests.log
            TestResults-build.xcresult
            TestResults-test.xcresult
          if-no-files-found: warn

  # ------------------------------------------------------------------
  # 作业 3：无头运行 UI 测试（XCUITest）
  #
  # `xcodebuild test` 通过 CoreSimulator 驱动设备，不依赖 `Simulator.app` 窗口，
  # 因此在没有模拟器 GUI 的环境也能跑；对应 docs/验证报告.md 附录 A 里 M01–M03 /
  # M05–M09 / M11–M14 / M17 / M23–M25 / M27–M29 的自动化部分。
  #
  # 与作业 2 分开的原因：UI 测试走的是真实 App 进程与手势，耗时与稳定性都和单元
  # 测试不同；分开后单测作业的「Executed N tests」仍能作为干净证据引用。
  # ------------------------------------------------------------------
  ui:
    name: UI Tests (XCUITest, headless)
    runs-on: macos-15
    env:
      PROJECT: CamCardClone.xcodeproj
      SCHEME: CamCardClone
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Pick an available iPhone simulator
        run: |
          xcrun simctl list devices available
          SIM_UDID=$(xcrun simctl list devices available \
            | grep -m1 -E '^[[:space:]]+iPhone ' \
            | sed -E 's/^[^(]*\(([0-9A-Fa-f-]{36})\).*/\1/' || true)
          if [ -z "$SIM_UDID" ]; then
            echo "::error::No available iPhone simulator found on this runner"
            exit 1
          fi
          echo "SIM_UDID=$SIM_UDID" >> "$GITHUB_ENV"
          echo "Using simulator UDID: $SIM_UDID"

      # 「相册导入」类用例要真的从系统相册选照片，所以先把合成名片喂进模拟器相册。
      # addmedia 写入的照片时间戳最新，图库按时间倒序排列后它们排在最前，
      # 与 ScanImportUITests 里「取网格第一张」的约定一致。
      - name: Seed the simulator photo library
        run: |
          xcrun simctl boot "$SIM_UDID" || true
          xcrun simctl bootstatus "$SIM_UDID" -b
          xcrun simctl addmedia "$SIM_UDID" testcards/images/*.png

      - name: Run UI tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "id=$SIM_UDID" \
            -derivedDataPath .build-xcode-ui \
            -only-testing:CamCardCloneUITests \
            -parallel-testing-enabled NO \
            -resultBundlePath TestResults-ui.xcresult \
            2>&1 | tee ui-tests.log

      - name: Surface errors as annotations
        if: failure()
        run: |
          for f in ui-tests.log; do
            [ -f "$f" ] || continue
            echo "===== $f ====="
            grep -E "error:|xcodebuild: error|Unable to find|Testing failed|XCTAssert|failed -" "$f" | head -n 20 > ui-errs.txt || true
            cat ui-errs.txt
            while IFS= read -r line; do
              echo "::error::$line"
            done < ui-errs.txt
          done

          # 选择器没打开时，测试会把 App 进程内的元素树按行加上 UIPROBE 前缀打印；
          # 日志端点需要仓库授权（实测 403），改走免登录的注解端点。单条约 4000 字符即被截断，
          # 因此按 8 行一条分块发。
          grep "^UIPROBE" ui-tests.log > ui-probe-lines.txt || true
          if [ -s ui-probe-lines.txt ]; then
            split -l 8 ui-probe-lines.txt ui-probe-part-
            for part in ui-probe-part-*; do
              escaped=$(sed -e 's/%/%25/g' "$part" | awk '{ printf "%s%%0A", $0 }')
              echo "::notice::$(basename "$part") $escaped"
            done
          fi

      - name: Upload UI test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ui-test-logs
          path: |
            ui-tests.log
            TestResults-ui.xcresult
          if-no-files-found: warn
